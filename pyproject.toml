[project]
name = "magazine-scraper"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "playwright",
    "ebooklib",
    "beautifulsoup4",
    "lxml",
    "pillow>=12.1.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
    "pre-commit",
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
